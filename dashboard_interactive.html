<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Grade SPIP — Interaktif</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background:#f8fafc; }
    .card { border:0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .sticky-topbar { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eaecef; }
    .kpi { display:flex; align-items:center; gap:.75rem; }
    .kpi .num { font-size:1.4rem; font-weight:700; }
    .table thead th { white-space:nowrap; }
    .toolbar .btn { white-space:nowrap; }
    .chart-card { min-height: 360px; }
    .badge.grade-a{background:#22c55e} .badge.grade-b{background:#a3e635;color:#111}
    .badge.grade-c{background:#facc15;color:#111} .badge.grade-d{background:#fb923c}
    .badge.grade-e{background:#ef4444}
  </style>
</head>
<body>
  <div class="sticky-topbar py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <h6 class="mb-0">📊 Dashboard Grade SPIP — Interaktif</h6>
      <div class="toolbar d-flex align-items-center gap-2">
        <input id="searchUnit" class="form-control form-control-sm" placeholder="Cari unit..." style="width:220px">
        <select id="filterCluster" class="form-select form-select-sm" style="width:180px">
          <option value="">Filter: Semua</option>
          <option value="AC">Kelompok A–C (baik)</option>
          <option value="DE">Kelompok D–E (butuh perbaikan)</option>
        </select>
        <button id="btn-refresh" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        <button id="btn-export-csv" class="btn btn-sm btn-outline-success"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
        <button id="btn-export-png" class="btn btn-sm btn-outline-primary"><i class="bi bi-image me-1"></i>Export Grafik</button>
      </div>
    </div>
  </div>

  <div class="container my-3">
    <div class="row g-3">
      <!-- KPIs -->
      <div class="col-12 col-lg-3">
        <div class="card">
          <div class="card-body kpi">
            <i class="bi bi-diagram-3 fs-3 text-secondary"></i>
            <div>
              <div class="text-muted small">Jumlah Unit</div>
              <div class="num" id="kpi-units">0</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card">
          <div class="card-body kpi">
            <span class="badge grade-a">A</span>
            <span class="badge grade-b">B</span>
            <span class="badge grade-c">C</span>
            <div>
              <div class="text-muted small">% A–C</div>
              <div class="num text-success" id="kpi-ac">0%</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card">
          <div class="card-body kpi">
            <span class="badge grade-d">D</span>
            <span class="badge grade-e">E</span>
            <div>
              <div class="text-muted small">% D–E</div>
              <div class="num text-danger" id="kpi-de">0%</div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-3">
        <div class="card">
          <div class="card-body kpi">
            <i class="bi bi-clock fs-3 text-secondary"></i>
            <div>
              <div class="text-muted small">Terakhir diperbarui</div>
              <div class="num" id="kpi-updated">—</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="col-12 col-lg-6">
        <div class="card chart-card">
          <div class="card-header bg-white"><strong>Distribusi Grade per Unit</strong></div>
          <div class="card-body"><canvas id="stackedChart"></canvas></div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card chart-card">
          <div class="card-header bg-white"><strong>Komposisi Keseluruhan</strong></div>
          <div class="card-body"><canvas id="donutChart"></canvas></div>
        </div>
      </div>

      <!-- Table -->
      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle" id="tbl">
                <thead class="table-light">
                  <tr>
                    <th data-sort="text" style="width:30%">Unit Organisasi</th>
                    <th class="text-center" data-sort="num">A</th>
                    <th class="text-center" data-sort="num">B</th>
                    <th class="text-center" data-sort="num">C</th>
                    <th class="text-center" data-sort="num">D</th>
                    <th class="text-center" data-sort="num">E</th>
                    <th class="text-center" data-sort="num">Total</th>
                    <th class="text-center" data-sort="num">% A–C</th>
                    <th class="text-center" data-sort="num">% D–E</th>
                  </tr>
                </thead>
                <tbody id="dash-body"></tbody>
                <tfoot class="table-light">
                  <tr>
                    <th class="text-end">Total</th>
                    <th class="text-center" id="tA">0</th>
                    <th class="text-center" id="tB">0</th>
                    <th class="text-center" id="tC">0</th>
                    <th class="text-center" id="tD">0</th>
                    <th class="text-center" id="tE">0</th>
                    <th class="text-center" id="tT">0</th>
                    <th class="text-center" id="tAC">0%</th>
                    <th class="text-center" id="tDE">0%</th>
                  </tr>
                </tfoot>
              </table>
            </div>
            <div class="text-muted small">Tip: ketik nama unit di kotak "Cari unit..." untuk memfilter.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let stackedChart, donutChart;

    // --- Util: parse tanggal aman (ISO string / number / Date) ---
    function parseDateAny(x){
      if (!x) return null;
      if (x instanceof Date) return isNaN(+x) ? null : x;
      if (typeof x === 'number') { const d = new Date(x); return isNaN(+d)?null:d; }
      if (typeof x === 'string') { const d = new Date(x); return isNaN(+d)?null:d; }
      return null;
    }

    // --- Baca dari localStorage (key yang sama dipakai form penilaian) ---
    function readData(){
      const raw = localStorage.getItem('gradeDashboardData') || '{}';
      try { return JSON.parse(raw); } catch(e){ return {}; }
    }

    // --- Normalisasi 1 record ke bentuk counts + tanggal ---
    function normalizeRecord(name, rec){
      // Skema 1 (baru): {counts:{A..E}, total, updated_at}
      if (rec && rec.counts) {
        return {
          name,
          A: rec.counts.A||0, B: rec.counts.B||0, C: rec.counts.C||0, D: rec.counts.D||0, E: rec.counts.E||0,
          T: (rec.total || (rec.counts.A||0)+(rec.counts.B||0)+(rec.counts.C||0)+(rec.counts.D||0)+(rec.counts.E||0)),
          updated_at: rec.updated_at || rec.updatedAt || null
        };
      }
      // Skema 2 (legacy/sederhana): {grade:"A|B|C|D|E", updated_at:...}
      const g = (rec && rec.grade ? String(rec.grade).toUpperCase() : '');
      const base = {A:0,B:0,C:0,D:0,E:0};
      if ('ABCDE'.includes(g)) base[g] = 1;
      return {
        name, ...base, T: Object.values(base).reduce((s,v)=>s+v,0),
        updated_at: rec?.updated_at || rec?.updatedAt || null
      };
    }

    // --- Hitung rows, sums, lastUpdated (Date) ---
    function compute(data){
      const rows = [];
      let sums = {A:0,B:0,C:0,D:0,E:0,T:0};
      let lastUpdated = null;

      Object.keys(data).forEach(name => {
        const norm = normalizeRecord(name, data[name]);
        const pctAC = norm.T ? Math.round(((norm.A+norm.B+norm.C)/norm.T)*100) : 0;
        const pctDE = norm.T ? Math.round(((norm.D+norm.E)/norm.T)*100) : 0;
        const du = parseDateAny(norm.updated_at);
        if (du && (!lastUpdated || du > lastUpdated)) lastUpdated = du;

        rows.push({ name:norm.name, A:norm.A, B:norm.B, C:norm.C, D:norm.D, E:norm.E, T:norm.T, pctAC, pctDE, updated_at: du });
        sums.A+=norm.A; sums.B+=norm.B; sums.C+=norm.C; sums.D+=norm.D; sums.E+=norm.E; sums.T+=norm.T;
      });

      return { rows, sums, lastUpdated };
    }

    // --- Re-sum dari rows (berguna setelah filter) ---
    function sumRows(rows){
      const s = {A:0,B:0,C:0,D:0,E:0,T:0};
      rows.forEach(r=>{ s.A+=r.A; s.B+=r.B; s.C+=r.C; s.D+=r.D; s.E+=r.E; s.T+=r.T; });
      return s;
    }

    // --- Tabel ---
    function fillTable(rows){
      const body = document.getElementById('dash-body');
      body.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.name}</td>
          <td class="text-center">${r.A}</td>
          <td class="text-center">${r.B}</td>
          <td class="text-center">${r.C}</td>
          <td class="text-center text-danger-emphasis">${r.D}</td>
          <td class="text-center text-danger">${r.E}</td>
          <td class="text-center fw-semibold">${r.T}</td>
          <td class="text-center text-success">${r.pctAC}%</td>
          <td class="text-center text-danger">${r.pctDE}%</td>`;
        body.appendChild(tr);
      });
    }

    // --- KPI & footer ---
    function updateKPI({ sums, units, lastUpdated }){
      const pctACAll = sums.T ? Math.round(((sums.A+sums.B+sums.C)/sums.T)*100) : 0;
      const pctDEAll = sums.T ? Math.round(((sums.D+sums.E)/sums.T)*100) : 0;

      document.getElementById('kpi-units').textContent = units;
      document.getElementById('kpi-ac').textContent = pctACAll + '%';
      document.getElementById('kpi-de').textContent = pctDEAll + '%';
      document.getElementById('kpi-updated').textContent = lastUpdated ? lastUpdated.toLocaleString('id-ID') : '—';

      document.getElementById('tA').textContent = sums.A;
      document.getElementById('tB').textContent = sums.B;
      document.getElementById('tC').textContent = sums.C;
      document.getElementById('tD').textContent = sums.D;
      document.getElementById('tE').textContent = sums.E;
      document.getElementById('tT').textContent = sums.T;
      document.getElementById('tAC').textContent = pctACAll + '%';
      document.getElementById('tDE').textContent = pctDEAll + '%';
    }

    // --- Charts ---
    function buildCharts(rows, sums){
      const labels = rows.map(r=>r.name);
      const dA = rows.map(r=>r.A), dB = rows.map(r=>r.B), dC = rows.map(r=>r.C), dD = rows.map(r=>r.D), dE = rows.map(r=>r.E);

      const ctx1 = document.getElementById('stackedChart');
      if (stackedChart) stackedChart.destroy();
      stackedChart = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'A', data: dA, backgroundColor: '#22c55e' },
            { label: 'B', data: dB, backgroundColor: '#a3e635' },
            { label: 'C', data: dC, backgroundColor: '#facc15' },
            { label: 'D', data: dD, backgroundColor: '#fb923c' },
            { label: 'E', data: dE, backgroundColor: '#ef4444' }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'bottom' },
            tooltip: { callbacks: {
              footer: (items)=>{
                const idx = items[0].dataIndex;
                const tot = rows[idx].T || 0;
                return 'Total: ' + tot;
              }
            }}
          },
          scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks:{ precision:0 } } }
        }
      });

      const ctx2 = document.getElementById('donutChart');
      if (donutChart) donutChart.destroy();
      donutChart = new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['A','B','C','D','E'],
          datasets: [{
            data: [sums.A, sums.B, sums.C, sums.D, sums.E],
            backgroundColor: ['#22c55e','#a3e635','#facc15','#fb923c','#ef4444']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });
    }

    // --- Exporters ---
    function exportCSV(){
      const data = readData();
      const units = Object.keys(data).sort();
      let csv = 'Unit,A,B,C,D,E,Total,%A-C,%D-E,UpdatedAt\n';
      units.forEach(name => {
        const rec = normalizeRecord(name, data[name]);
        const T = rec.T;
        const pctAC = T? Math.round((rec.A+rec.B+rec.C)/T*100) : 0;
        const pctDE = T? Math.round((rec.D+rec.E)/T*100) : 0;
        const du = parseDateAny(rec.updated_at);
        csv += `"${name}",${rec.A},${rec.B},${rec.C},${rec.D},${rec.E},${T},${pctAC}%,${pctDE}%,${du?du.toISOString():''}\n`;
      });
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'dashboard_grade.csv'; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 500);
    }

    function exportPNG(){
      const link1 = document.createElement('a');
      link1.href = stackedChart.toBase64Image(); link1.download = 'distribusi_per_unit.png'; link1.click();
      setTimeout(()=>{
        const link2 = document.createElement('a');
        link2.href = donutChart.toBase64Image(); link2.download = 'komposisi_keseluruhan.png'; link2.click();
      }, 300);
    }

    // --- Filter & pencarian ---
    function applyFilterSearch(rows){
      const q = document.getElementById('searchUnit').value.trim().toLowerCase();
      const cluster = document.getElementById('filterCluster').value;
      return rows.filter(r => {
        const okName = !q || r.name.toLowerCase().includes(q);
        let okCluster = true;
        if (cluster === 'AC') okCluster = (r.pctAC >= r.pctDE);
        if (cluster === 'DE') okCluster = (r.pctDE > r.pctAC);
        return okName && okCluster;
      });
    }

    function sortTableBy(th, rows){
      const type = th.dataset.sort || 'text';
      const idx = Array.from(th.parentElement.children).indexOf(th);
      const dir = (th.dataset.dir === 'asc') ? 'desc' : 'asc';
      th.dataset.dir = dir;
      const factor = dir === 'asc' ? 1 : -1;
      rows.sort((a,b)=>{
        const A = [a.name,a.A,a.B,a.C,a.D,a.E,a.T,a.pctAC,a.pctDE];
        const B = [b.name,b.A,b.B,b.C,b.D,b.E,b.T,b.pctAC,b.pctDE];
        const va = A[idx], vb = B[idx];
        if (type === 'num') return (va - vb) * factor;
        return String(va).localeCompare(String(vb)) * factor;
      });
    }

    // --- Render utama ---
    function render(){
      const data = readData();
      const base = compute(data);                 // semua data
      let rows = applyFilterSearch(base.rows);    // sesuaikan filter/pencarian
      const sumsFiltered = sumRows(rows);
      const last = base.lastUpdated;              // terakhir update (global)

      // Tabel & KPI (berdasarkan hasil filter)
      fillTable(rows);
      updateKPI({ sums: sumsFiltered, units: rows.length, lastUpdated: last });

      // Charts pakai data filtered
      buildCharts(rows, sumsFiltered);
    }

    document.addEventListener('DOMContentLoaded', () => {
      render();

      document.getElementById('btn-refresh').addEventListener('click', render);
      document.getElementById('btn-export-csv').addEventListener('click', exportCSV);
      document.getElementById('btn-export-png').addEventListener('click', exportPNG);
      document.getElementById('searchUnit').addEventListener('input', render);
      document.getElementById('filterCluster').addEventListener('change', render);

      // Simple sortable headers
      document.querySelectorAll('#tbl thead th').forEach(th => {
        th.style.cursor = 'pointer';
        th.addEventListener('click', () => {
          const data = readData();
          let rows = applyFilterSearch(compute(data).rows);
          sortTableBy(th, rows);
          fillTable(rows);
          buildCharts(rows, sumRows(rows));
        });
      });

      // Live update bila localStorage di-update dari tab/halaman lain
      window.addEventListener('storage', (e) => {
        if (e.key === 'gradeDashboardData') render();
      });
    });
  </script>
</body>
</html>
