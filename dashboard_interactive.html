<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Grade SPIP — Interaktif</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { background:#f8fafc; }
    .card { border:0; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .sticky-topbar { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid #eaecef; }
    .kpi .num { font-size:1.4rem; font-weight:700; }
    .chart-card { min-height: 360px; }
    .badge.grade-a{background:#22c55e} .badge.grade-b{background:#a3e635;color:#111}
    .badge.grade-c{background:#facc15;color:#111} .badge.grade-d{background:#fb923c}
    .badge.grade-e{background:#ef4444}
  </style>
</head>
<body>
  <div class="sticky-topbar py-2">
    <div class="container d-flex align-items-center justify-content-between">
      <h6 class="mb-0">📊 Dashboard Grade SPIP — Interaktif</h6>
      <div class="d-flex align-items-center gap-2">
        <input id="searchUnit" class="form-control form-control-sm" placeholder="Cari unit..." style="width:220px">
        <select id="filterCluster" class="form-select form-select-sm" style="width:180px">
          <option value="">Filter: Semua</option>
          <option value="AC">Kelompok A–C (baik)</option>
          <option value="DE">Kelompok D–E (butuh perbaikan)</option>
        </select>
        <button id="btn-refresh" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        <button id="btn-export-csv" class="btn btn-sm btn-outline-success"><i class="bi bi-filetype-csv me-1"></i>Export CSV</button>
        <button id="btn-export-png" class="btn btn-sm btn-outline-primary"><i class="bi bi-image me-1"></i>Export Grafik</button>
      </div>
    </div>
  </div>

  <div class="container my-3">
    <div class="row g-3">
      <div class="col-12 col-lg-3">
        <div class="card"><div class="card-body d-flex align-items-center gap-3">
          <i class="bi bi-diagram-3 fs-3 text-secondary"></i>
          <div><div class="text-muted small">Jumlah Unit</div><div class="num" id="kpi-units">0</div></div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card"><div class="card-body d-flex align-items-center gap-3">
          <span class="badge grade-a">A</span><span class="badge grade-b">B</span><span class="badge grade-c">C</span>
          <div><div class="text-muted small">% A–C</div><div class="num text-success" id="kpi-ac">0%</div></div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card"><div class="card-body d-flex align-items-center gap-3">
          <span class="badge grade-d">D</span><span class="badge grade-e">E</span>
          <div><div class="text-muted small">% D–E</div><div class="num text-danger" id="kpi-de">0%</div></div>
        </div></div>
      </div>
      <div class="col-12 col-lg-3">
        <div class="card"><div class="card-body d-flex align-items-center gap-3">
          <i class="bi bi-clock fs-3 text-secondary"></i>
          <div><div class="text-muted small">Terakhir diperbarui</div><div class="num" id="kpi-updated">—</div></div>
        </div></div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card chart-card">
          <div class="card-header bg-white"><strong>Distribusi Grade per Unit</strong></div>
          <div class="card-body"><canvas id="stackedChart"></canvas></div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card chart-card">
          <div class="card-header bg-white"><strong>Komposisi Keseluruhan</strong></div>
          <div class="card-body"><canvas id="donutChart"></canvas></div>
        </div>
      </div>

      <div class="col-12">
        <div class="card">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle" id="tbl">
                <thead class="table-light">
                  <tr>
                    <th data-sort="text" style="width:30%">Unit Organisasi</th>
                    <th class="text-center" data-sort="num">A</th>
                    <th class="text-center" data-sort="num">B</th>
                    <th class="text-center" data-sort="num">C</th>
                    <th class="text-center" data-sort="num">D</th>
                    <th class="text-center" data-sort="num">E</th>
                    <th class="text-center" data-sort="num">Total</th>
                    <th class="text-center" data-sort="num">% A–C</th>
                    <th class="text-center" data-sort="num">% D–E</th>
                  </tr>
                </thead>
                <tbody id="dash-body"></tbody>
                <tfoot class="table-light">
                  <tr>
                    <th class="text-end">Total</th>
                    <th class="text-center" id="tA">0</th>
                    <th class="text-center" id="tB">0</th>
                    <th class="text-center" id="tC">0</th>
                    <th class="text-center" id="tD">0</th>
                    <th class="text-center" id="tE">0</th>
                    <th class="text-center" id="tT">0</th>
                    <th class="text-center" id="tAC">0%</th>
                    <th class="text-center" id="tDE">0%</th>
                  </tr>
                </tfoot>
              </table>
            </div>
            <div class="text-muted small">Tip: ketik nama unit di kotak "Cari unit..." untuk memfilter.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let stackedChart, donutChart;
    const $ = (s)=>document.querySelector(s);

    // Parser tanggal aman
    function parseDateAny(x){
      try{
        if (!x) return null;
        if (x instanceof Date) return isNaN(+x) ? null : x;
        if (typeof x === 'number') { const d=new Date(x); return isNaN(+d)?null:d; }
        if (typeof x === 'string') { const d=new Date(x); return isNaN(+d)?null:d; }
        // dukung bentuk Timestamp-like {seconds,nanos}
        if (typeof x === 'object' && typeof x.seconds === 'number') {
          const d=new Date(x.seconds*1000); return isNaN(+d)?null:d;
        }
        return null;
      }catch{ return null; }
    }

    // Ambil data dari localStorage
    function readData(){
      try { return JSON.parse(localStorage.getItem('gradeDashboardData') || '{}'); }
      catch(e){ return {}; }
    }

    // Normalisasi record -> counts + tanggal
    function normalizeRecord(name, rec){
      // Skema counts
      if (rec && rec.counts){
        const c=rec.counts;
        const A=c.A||0, B=c.B||0, C=c.C||0, D=c.D||0, E=c.E||0;
        const T = rec.total || (A+B+C+D+E);
        return { name, A,B,C,D,E, T, updated_at: rec.updated_at || rec.updatedAt || null };
      }
      // Skema grade tunggal
      const g = (rec && rec.grade ? String(rec.grade).toUpperCase() : '');
      const base = {A:0,B:0,C:0,D:0,E:0};
      if ('ABCDE'.includes(g)) base[g]=1;
      return { name, ...base, T:1, updated_at: rec?.updated_at || rec?.updatedAt || null };
    }

    // Hitung rows + total + lastUpdated
    function compute(data){
      const rows=[]; const sums={A:0,B:0,C:0,D:0,E:0,T:0};
      let lastUpdated=null;
      for (const name of Object.keys(data)){
        const n = normalizeRecord(name, data[name]);
        const pctAC = n.T ? Math.round(((n.A+n.B+n.C)/n.T)*100) : 0;
        const pctDE = n.T ? Math.round(((n.D+n.E)/n.T)*100) : 0;
        const du = parseDateAny(n.updated_at);
        if (du && (!lastUpdated || du > lastUpdated)) lastUpdated = du;
        rows.push({name:n.name, A:n.A,B:n.B,C:n.C,D:n.D,E:n.E, T:n.T, pctAC, pctDE, updated_at:du});
        sums.A+=n.A; sums.B+=n.B; sums.C+=n.C; sums.D+=n.D; sums.E+=n.E; sums.T+=n.T;
      }
      return { rows, sums, lastUpdated };
    }

    // Sum ulang sesudah filter
    function sumRows(rows){
      const s={A:0,B:0,C:0,D:0,E:0,T:0};
      rows.forEach(r=>{ s.A+=r.A; s.B+=r.B; s.C+=r.C; s.D+=r.D; s.E+=r.E; s.T+=r.T; });
      return s;
    }

    function fillTable(rows){
      const body=$('#dash-body'); body.innerHTML='';
      rows.forEach(r=>{
        const tr=document.createElement('tr');
        tr.innerHTML =
          `<td>${r.name}</td>
           <td class="text-center">${r.A}</td>
           <td class="text-center">${r.B}</td>
           <td class="text-center">${r.C}</td>
           <td class="text-center text-danger-emphasis">${r.D}</td>
           <td class="text-center text-danger">${r.E}</td>
           <td class="text-center fw-semibold">${r.T}</td>
           <td class="text-center text-success">${r.pctAC}%</td>
           <td class="text-center text-danger">${r.pctDE}%</td>`;
        body.appendChild(tr);
      });
    }

    function updateKPI({ sums, units, lastUpdated }){
      const pctACAll = sums.T ? Math.round(((sums.A+sums.B+sums.C)/sums.T)*100) : 0;
      const pctDEAll = sums.T ? Math.round(((sums.D+sums.E)/sums.T)*100) : 0;

      $('#kpi-units').textContent = units;
      $('#kpi-ac').textContent = pctACAll + '%';
      $('#kpi-de').textContent = pctDEAll + '%';
      $('#kpi-updated').textContent = lastUpdated ? lastUpdated.toLocaleString('id-ID') : '—';

      $('#tA').textContent=sums.A; $('#tB').textContent=sums.B; $('#tC').textContent=sums.C;
      $('#tD').textContent=sums.D; $('#tE').textContent=sums.E; $('#tT').textContent=sums.T;
      $('#tAC').textContent=pctACAll+'%'; $('#tDE').textContent=pctDEAll+'%';
    }

    function buildCharts(rows, sums){
      const labels=rows.map(r=>r.name);
      const dA=rows.map(r=>r.A), dB=rows.map(r=>r.B), dC=rows.map(r=>r.C), dD=rows.map(r=>r.D), dE=rows.map(r=>r.E);

      if (stackedChart) stackedChart.destroy();
      stackedChart = new Chart(document.getElementById('stackedChart'), {
        type:'bar',
        data:{ labels, datasets:[
          {label:'A',data:dA,backgroundColor:'#22c55e'},
          {label:'B',data:dB,backgroundColor:'#a3e635'},
          {label:'C',data:dC,backgroundColor:'#facc15'},
          {label:'D',data:dD,backgroundColor:'#fb923c'},
          {label:'E',data:dE,backgroundColor:'#ef4444'}
        ]},
        options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
          plugins:{ legend:{position:'bottom'},
            tooltip:{callbacks:{ footer:(items)=>{const i=items[0].dataIndex; return 'Total: '+rows[i].T; }}} },
          scales:{ x:{stacked:true}, y:{stacked:true, beginAtZero:true, ticks:{precision:0}} }
        }
      });

      if (donutChart) donutChart.destroy();
      donutChart = new Chart(document.getElementById('donutChart'), {
        type:'doughnut',
        data:{ labels:['A','B','C','D','E'],
          datasets:[{ data:[sums.A,sums.B,sums.C,sums.D,sums.E],
          backgroundColor:['#22c55e','#a3e635','#facc15','#fb923c','#ef4444'] }]},
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}} }
      });
    }

    function exportCSV(){
      const data=readData(); const units=Object.keys(data).sort();
      let csv='Unit,A,B,C,D,E,Total,%A-C,%D-E,UpdatedAt\n';
      units.forEach(name=>{
        const n = normalizeRecord(name, data[name]);
        const T = n.T; const pctAC = T? Math.round((n.A+n.B+n.C)/T*100):0;
        const pctDE = T? Math.round((n.D+n.E)/T*100):0;
        const du = parseDateAny(n.updated_at);
        csv += `"${name}",${n.A},${n.B},${n.C},${n.D},${n.E},${T},${pctAC}%,${pctDE}%,${du?du.toISOString():''}\n`;
      });
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob); const a=document.createElement('a');
      a.href=url; a.download='dashboard_grade.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),500);
    }

    function exportPNG(){
      const a1=document.createElement('a'); a1.href=stackedChart.toBase64Image(); a1.download='distribusi_per_unit.png'; a1.click();
      setTimeout(()=>{ const a2=document.createElement('a'); a2.href=donutChart.toBase64Image(); a2.download='komposisi_keseluruhan.png'; a2.click(); },300);
    }

    function applyFilterSearch(rows){
      const q=$('#searchUnit').value.trim().toLowerCase();
      const cluster=$('#filterCluster').value;
      return rows.filter(r=>{
        const okName=!q || r.name.toLowerCase().includes(q);
        let okCluster=true;
        if(cluster==='AC') okCluster=(r.pctAC >= r.pctDE);
        if(cluster==='DE') okCluster=(r.pctDE > r.pctAC);
        return okName && okCluster;
      });
    }

    function sortTableBy(th, rows){
      const type=th.dataset.sort||'text';
      const idx=[...th.parentElement.children].indexOf(th);
      const dir=(th.dataset.dir==='asc')?'desc':'asc'; th.dataset.dir=dir; const factor=dir==='asc'?1:-1;
      rows.sort((a,b)=>{
        const A=[a.name,a.A,a.B,a.C,a.D,a.E,a.T,a.pctAC,a.pctDE], B=[b.name,b.A,b.B,b.C,b.D,b.E,b.T,b.pctAC,b.pctDE];
        const va=A[idx], vb=B[idx];
        if(type==='num') return (va - vb)*factor;
        return String(va).localeCompare(String(vb))*factor;
      });
    }

    function render(){
      const data = readData();
      const base = compute(data);       // semua data
      let rows = applyFilterSearch(base.rows);
      const sumsFiltered = sumRows(rows);
      fillTable(rows);
      updateKPI({ sums: sumsFiltered, units: rows.length, lastUpdated: base.lastUpdated });
      buildCharts(rows, sumsFiltered);
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      render();
      $('#btn-refresh').addEventListener('click', render);
      $('#btn-export-csv').addEventListener('click', exportCSV);
      $('#btn-export-png').addEventListener('click', exportPNG);
      $('#searchUnit').addEventListener('input', render);
      $('#filterCluster').addEventListener('change', render);

      // Sortable
      document.querySelectorAll('#tbl thead th').forEach(th=>{
        th.style.cursor='pointer';
        th.addEventListener('click', ()=>{
          const data=readData();
          let rows=applyFilterSearch(compute(data).rows);
          sortTableBy(th, rows);
          fillTable(rows);
          buildCharts(rows, sumRows(rows));
        });
      });

      // Auto-refresh bila localStorage berubah dari tab/halaman lain
      window.addEventListener('storage', (e)=>{ if (e.key==='gradeDashboardData') render(); });

      // Auto-refresh saat kembali ke tab (mis. form simpan di tab lain)
      document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) render(); });
    });
  document.getElementById('btnSimpan').addEventListener('click', () => {
  const unitName  = document.getElementById('unitName').value;
  const gradeValue= document.getElementById('simpulan').value; // A/B/C/D/E
  const db = JSON.parse(localStorage.getItem('gradeDashboardData') || '{}');
  db[unitName] = { grade: gradeValue, updated_at: new Date().toISOString() };
  localStorage.setItem('gradeDashboardData', JSON.stringify(db));
});
</script>
</body>
</html>
