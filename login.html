<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPIP – Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(145deg, #e3f2fd, #f9f9f9);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      padding: 2rem;
    }
    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 .2rem rgba(13,110,253,.25);
    }
    #dashboard-link { display: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <h4 class="text-center mb-3 text-primary"><i class="bi bi-shield-lock"></i> Login Aplikasi SPIP</h4>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="nama@domain.go.id" required />
        <div class="invalid-feedback">Masukkan email dengan benar.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Kata Sandi</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
        <div class="invalid-feedback">Masukkan kata sandi Anda.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
      </button>

      <div id="loginError" class="text-danger small mt-3 text-center"></div>
    </form>

    <div class="text-center mt-4 small text-muted">
      Belum punya akun? <a href="#" id="registerLink">Daftar Baru</a>
    </div>

    <div id="dashboard-link" class="text-center mt-4">
      <a href="PKSPIP/index.html" class="btn btn-success w-100">
        <i class="bi bi-speedometer2 me-1"></i> Buka Dashboard SPIP
      </a>
      <button id="logoutBtn" class="btn btn-outline-danger w-100 mt-2">
        <i class="bi bi-box-arrow-right me-1"></i> Keluar
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYwuJHeL_YlyW7zPNRGSXe_NB8r_Ql_t0",
      authDomain: "spip-8e5e9.firebaseapp.com",
      projectId: "spip-8e5e9",
      appId: "1:448004404076:web:6aa65c8de90439285db949",
      measurementId: "G-J44L941K89"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const dashboardLink = document.getElementById("dashboard-link");
    const registerLink = document.getElementById("registerLink");
    const logoutBtn = document.getElementById("logoutBtn");

    let isRegisterMode = false;

    // Handle login/register form submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const pass  = form.password.value;
      form.classList.add("was-validated");
      if (!form.checkValidity()) return;
      errorBox.textContent = "";

      try {
        if (isRegisterMode) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        errorBox.textContent = err.message.replace("Firebase:", "");
      }
    });

    // Mode toggle
    registerLink.addEventListener("click", (e) => {
      e.preventDefault();
      isRegisterMode = !isRegisterMode;
      registerLink.textContent = isRegisterMode ? "Sudah punya akun? Masuk" : "Daftar Baru";
      form.querySelector("button[type='submit']").innerHTML = 
        isRegisterMode 
          ? '<i class="bi bi-person-plus me-1"></i> Daftar'
          : '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk';
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
    });

    // Pantau status login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        form.style.display = "none";
        registerLink.style.display = "none";
        dashboardLink.style.display = "block";
      } else {
        form.style.display = "block";
        registerLink.style.display = "block";
        dashboardLink.style.display = "none";
      }
    });
  </script>

</body>
</html>
