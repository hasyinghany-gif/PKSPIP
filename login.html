<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login SPIP</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* Custom styles for the login page */
    :root{
      --brand:#0d6efd;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
      background-color: #f8f9fa;
    }
    #login-section {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(145deg, #e9f2ff, #f9fafb);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(13, 110, 253, .08);
      padding: 2rem;
      border: 1px solid #eef2f7;
    }
    .login-card .btn { width: 100%; }
    .login-card a { cursor: pointer; }
  </style>
</head>

<body>

  <!-- Login Section -->
  <section id="login-section">
    <div class="login-card">
      <div class="text-center mb-3">
        <img src="logo-spip.png" alt="Logo SPIP" style="height:48px; object-fit:contain;" onerror="this.style.display='none'">
      </div>
      <h4 class="text-center mb-3 text-primary"><i class="bi bi-shield-lock"></i> Login SPIP</h4>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@domain.go.id" required />
          <div class="invalid-feedback">Masukkan email yang valid.</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Kata Sandi</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required />
          <div class="invalid-feedback">Masukkan kata sandi.</div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Masuk
        </button>
        <div id="loginError" class="text-danger small mt-3 text-center"></div>
      </form>

      <div class="text-center mt-3 small text-muted">
        <span id="toggleText">Belum punya akun?</span>
        <a id="toggleLink">Daftar Baru</a>
      </div>
    </div>
  </section>

  <!-- Firebase Authentication Script -->
  <script type="module">
    // Firebase configuration
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYwuJHeL_YlyW7zPNRGSXe_NB8r_Ql_t0",
      authDomain: "spip-8e5e9.firebaseapp.com",
      projectId: "spip-8e5e9",
      appId: "1:448004404076:web:6aa65c8de90439285db949",
      measurementId: "G-J44L941K89"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Form & Error handling
    const loginSection = document.getElementById("login-section");
    const appSection = document.getElementById("app");
    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const toggleLink = document.getElementById("toggleLink");
    const toggleText = document.getElementById("toggleText");
    const submitBtn = document.getElementById("submitBtn");

    let isRegister = false;

    toggleLink.addEventListener("click", e => {
      e.preventDefault();
      isRegister = !isRegister;
      toggleText.textContent = isRegister ? "Sudah punya akun?" : "Belum punya akun?";
      toggleLink.textContent = isRegister ? "Masuk" : "Daftar Baru";
      submitBtn.innerHTML = isRegister
        ? '<i class="bi bi-person-plus me-1"></i> Daftar'
        : '<i class="bi bi-box-arrow-in-right me-1"></i> Masuk';
    });

    form.addEventListener("submit", async e => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const pass = document.getElementById("password").value;
      form.classList.add("was-validated");
      if (!form.checkValidity()) return;
      errorBox.textContent = "";
      try {
        if (isRegister) {
          await createUserWithEmailAndPassword(auth, email, pass);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
      } catch (err) {
        errorBox.textContent = (err?.message || "Login gagal").replace("Firebase:", "");
      }
    });

    // Firebase Auth State Change
    onAuthStateChanged(auth, user => {
      if (user) {
        loginSection.style.display = "none";
        appSection.style.display = "block";
        // Redirect or load your app logic here
      } else {
        loginSection.style.display = "flex";
        appSection.style.display = "none";
      }
    });

  </script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</body>
</html>
