<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPIP Assessment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    #login-section {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#fff,#f3f4f6);
    }
    .login-card {
      max-width: 380px; width: 100%;
      background: white; padding: 2rem 2.5rem; border-radius: 1rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }
    .logo-circle {
      width: 72px; height: 72px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg,#ffc107,#ffb100);
      color: white; font-size: 1.8rem; font-weight: bold;
      margin: 0 auto 1rem;
    }
    #app { display: none; }
  </style>
</head>
<body>
  <!-- LOGIN SECTION -->
  <section id="login-section">
    <div class="login-card text-center">
      <div class="logo-circle mb-2">SP</div>
      <h4 class="mb-3 fw-bold text-secondary">SPIP Assessment Portal</h4>
      <form id="loginForm" novalidate>
        <div class="form-floating mb-3">
          <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          <label for="email">Email</label>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control" id="password" placeholder="Password" required>
          <label for="password">Password</label>
        </div>
        <button class="btn btn-warning w-100 mb-2" id="submitBtn" type="submit">
          <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
        </button>
        <div class="small text-muted" id="toggleText">Belum punya akun?
          <a href="#" id="toggleLink">Daftar Baru</a>
        </div>
        <div class="text-danger small mt-2" id="loginError"></div>
      </form>
    </div>
  </section>

  <!-- APP SECTION -->
  <div id="app" class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="fw-bold">📊 SPIP Assessment Dashboard</h4>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-left me-1"></i>Keluar</button>
    </div>
    <div id="loader" class="alert alert-info">Memuat data...</div>
    <div id="main-content" class="d-none">
      <div class="mb-3">
        <label for="satker-select" class="form-label">Pilih Unit Kerja</label>
        <select id="satker-select" class="form-select w-auto"></select>
      </div>
      <div class="progress mb-3" style="height:20px;">
        <div id="progress-bar" class="progress-bar progress-bar-striped bg-warning" style="width:0%">0%</div>
      </div>
      <table class="table table-bordered table-striped">
        <thead class="table-light"><tr><th>Kode</th><th>Parameter</th><th>Status</th><th>TOC</th><th>Penilaian</th><th>Grade</th></tr></thead>
        <tbody id="assessment-table-body"></tbody>
      </table>
      <div id="last-saved" class="small text-muted">—</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt7CTp9FeL31ty8CZceG7LyoBBg0PSk_A",
      authDomain: "spip-8e5e9.firebaseapp.com",
      projectId: "spip-8e5e9",
      storageBucket: "spip-8e5e9.appspot.com",
      messagingSenderId: "203736036927",
      appId: "1:203736036927:web:746450a362f48291bb6b75"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginSection = document.getElementById('login-section');
    const appSection = document.getElementById('app');
    const loginForm = document.getElementById('loginForm');
    const toggleLink = document.getElementById('toggleLink');
    const toggleText = document.getElementById('toggleText');
    const submitBtn = document.getElementById('submitBtn');
    const loginError = document.getElementById('loginError');
    const logoutBtn = document.getElementById('logoutBtn');
    let isRegister = false;

    toggleLink.addEventListener('click', e => {
      e.preventDefault();
      isRegister = !isRegister;
      document.querySelector('h4').textContent = isRegister ? 'Daftar Akun SPIP' : 'Login SPIP';
      submitBtn.innerHTML = isRegister ? '<i class="bi bi-person-plus me-1"></i>Daftar' : '<i class="bi bi-box-arrow-in-right me-1"></i>Masuk';
      toggleText.textContent = isRegister ? 'Sudah punya akun?' : 'Belum punya akun?';
      toggleLink.textContent = isRegister ? 'Login' : 'Daftar Baru';
      loginError.textContent = '';
    });

    loginForm.addEventListener('submit', async e => {
      e.preventDefault();
      loginError.textContent = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      try {
        submitBtn.disabled = true;
        if (isRegister) await createUserWithEmailAndPassword(auth, email, password);
        else await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        loginError.textContent = err.code.includes('email') ? 'Email sudah digunakan.' : 'Login gagal.';
      } finally {
        submitBtn.disabled = false;
      }
    });

    logoutBtn.addEventListener('click', async ()=> await signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        loginSection.style.display = 'none';
        appSection.style.display = 'block';
      } else {
        appSection.style.display = 'none';
        loginSection.style.display = 'flex';
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
