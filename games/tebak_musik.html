<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PKSPIP – Game Musik (Campaign Mode)</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{--ink:#e5e7eb;--muted:#9aa9c2;--brand:#38bdf8;--good:#34d399;--bad:#ef4444;--panel:#0b1220;--border:#182131;--bg:#0f172a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui}
a.back{position:fixed;left:12px;top:12px;color:#38bdf8;text-decoration:none;z-index:3}
.wrap{max-width:940px;margin:70px auto 40px;padding:0 16px}
h1{margin:0;color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.select{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#111827;border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:#334155}
.btn-pill{border-radius:999px}
.badge{padding:6px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:#0b1220}
input[type="text"]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#0b1220;color:var(--ink);font-size:16px;outline:none}
.progress{height:8px;background:#101826;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#60a5fa)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
#status{display:flex;gap:10px;flex-wrap:wrap}
.ok{color:var(--good)} .no{color:var(--bad)} .big{font-size:18px}
.subtle{color:var(--muted);font-size:14px;margin:0}
.hint{font-style:italic;color:var(--muted)}
audio{width:100%}
.hidden{display:none}
#lyric-prompt{font-size:18px;line-height:1.7}
.mv-frame{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#0b1220}
.mv-frame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;filter:none;transition:filter .25s}
.mv-blur{filter:blur(6px) brightness(.85)}
.mv-caption{position:absolute;right:8px;bottom:8px;background:#0009;color:#cbd5e1;border:1px solid #000;backdrop-filter:blur(2px);padding:4px 8px;border-radius:8px;font-size:12px}
.mv-path{font-size:12px;color:#9aa9c2;margin-top:6px;background:#0b1220;border:1px solid #182131;padding:6px 8px;border-radius:8px;display:none}
.mv-path code{color:#e5e7eb}
#overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:10}
#card{background:#0b1220;border:1px solid #182131;padding:20px;border-radius:16px;min-width:300px;max-width:90%}
</style>
</head>
<body>
<a class="back" href="../main.html">⟵ Kembali</a>

<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:8px">
    <div>
      <h1><i class="bi bi-music-note-beamed"></i> Game Musik</h1>
      <p class="subtle">Campaign: Lagu → Lirik → Penyanyi → MV (skor kumulatif)</p>
    </div>
    <div id="status">
      <span class="badge">Skor: <b id="score">0</b></span>
      <span class="badge">Streak: <b id="streak">0</b></span>
      <span class="badge">Waktu: <b id="time">-</b>s</span>
      <span class="badge">High Score: <b id="best">0</b></span>
      <span class="badge" id="roundInfo">Round: -/-</span>
      <span class="badge" id="modeInfo">Mode: -</span>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between">
      <div class="select">
        <button class="btn btn-pill" id="btnCampaign"><i class="bi bi-rocket-takeoff"></i> Start Campaign</button>
        <button class="btn btn-pill" data-mode="guessSong">Mode Bebas: Tebak Lagu</button>
        <button class="btn btn-pill" data-mode="finishLyric">Mode Bebas: Sambung Lirik</button>
        <button class="btn btn-pill" data-mode="guessArtist">Mode Bebas: Tebak Penyanyi</button>
        <button class="btn btn-pill" data-mode="guessMV">Mode Bebas: Tebak MV</button>
      </div>
      <div class="row">
        <button class="btn" id="btnPlay"><i class="bi bi-play-fill"></i> Play</button>
        <button class="btn" id="btnHint"><i class="bi bi-lightbulb"></i> Hint</button>
        <button class="btn" id="btnSkip"><i class="bi bi-skip-forward-fill"></i> Lewati</button>
        <button class="btn" id="btnReveal"><i class="bi bi-eye"></i> Jawaban</button>
        <button class="btn" id="btnNext"><i class="bi bi-arrow-right"></i> Next</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="title">Soal</h2>
      <p id="subtitle" class="subtle">—</p>

      <!-- AUDIO -->
      <div id="block-audio" class="">
        <audio id="audio" preload="metadata" controls></audio>
      </div>

      <!-- LIRIK -->
      <div id="block-lyric" class="hidden">
        <div id="lyric-prompt" class="card" style="margin-top:8px;background:#0b1220"></div>
      </div>

      <!-- GAMBAR MV -->
      <div id="block-mv" class="hidden">
        <div class="mv-frame" style="margin-top:8px">
          <img id="mv-image" src="" alt="Potongan video klip" loading="eager"/>
          <div class="mv-caption">Potongan video klip</div>
        </div>
        <div class="row" style="margin-top:6px;align-items:center">
          <button class="btn btn-pill" id="btnShowPath">Show path</button>
          <span id="mvPath" class="mv-path">Path: <code id="mvPathText"></code></span>
        </div>
      </div>

      <div style="margin-top:10px">
        <div class="progress"><div id="bar" class="bar"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>Jawab</h2>
      <p class="subtle" id="guide">Ketik jawabanmu lalu Enter.</p>
      <input id="answer" type="text" placeholder="Ketik di sini... (Enter untuk kirim)"/>
      <p id="feedback" class="subtle" style="min-height:22px;margin-top:8px"></p>
      <p id="hint" class="hint"></p>
      <p id="reveal" class="hidden big"></p>
    </div>
  </div>
</div>

<!-- Overlay hasil akhir campaign -->
<div id="overlay">
  <div id="card">
    <h2>Campaign Selesai</h2>
    <p id="finalText" style="margin:8px 0 14px">Skor total: 0</p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="btnReplayCampaign"><i class="bi bi-arrow-repeat"></i> Main Lagi</button>
      <button class="btn" id="btnCloseOverlay">Tutup</button>
    </div>
  </div>
</div>

<script>
/* ================= DATASET TERPISAH =================
   TODO: ISI DATAMU DI SINI.
   Catatan path: file ini berada di /games/tebak_musik.html
   kalau assets di root (/assets/..), gunakan prefix "../assets/.."
*/
// 1) Tebak Lagu (judul dari audio) – isi 6 lagu
const SONGS_GUESS_TITLE = [
  { title:'Speak for YourSelf', audio:'../assets/audio/song1.mp3' },
  { title:'Castle of Glass', audio:'../assets/audio/song2.mp3' },
  { title:'Grand Escape', audio:'../assets/audio/song3.mp3' },
];

/* ————— 2) Sambung Lirik (teks → teks) —————
   Gunakan teks milikmu (hindari kutipan berhak cipta). */
const LYRICS_SET = [
  { prompt:'Pancene kowe pabu, nuruti ibumu. Jare nek ra Ninja, ra oleh dicinta',
    next:'Opo koyo ngene susahe wong kere? Ameh nyanding tresno, kalah karo bondo' },
  { prompt:'Satu alasan kenapa kau kurekam dalam memori, Satu cerita teringat di dalam hati',
    next:'Karena kau berharga dalam hidupku, teman Untuk satu pijakan menuju masa depan.' },
  { prompt:'Hitam putih jalan hidup, Pahit getir warna dunia',
    next:'Tangis tawa rasa hati, Terluka atau bahagia.' },
];

/* ————— 3) Tebak Penyanyi (audio → artis) ————— */
const SONGS_GUESS_ARTIST = [
  // boleh 3–6 item, judul tidak wajib (opsional)
  { artist:['Twentyfirst Night'], audio:'../assets/audio/song4.mp3', title:'(opsional judul)' },
  { artist:['Fun'], audio:'../assets/audio/song5.mp3' },
  { artist:['for Revenge'], audio:'../assets/audio/song6.mp3' },
];

/* ————— 4) Tebak MV (gambar → judul lagu) ————— */
const MV_SET = [
  { title:'Just The Way You Are', image:'../assets/mv/mv1.png' },
  { title:'Manusia Bodoh', image:'../assets/mv/mv2.png' },
  { title:'Still Life', image:'../assets/mv/mv3.png' },
];

/* ===== Prefix helper untuk MV + error display (anti-404) ===== */
const MV_PREFIX = "../assets/mv/";
const MV_PLACEHOLDER = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450'>
     <rect width='100%' height='100%' fill='#0b1220'/>
     <text x='50%' y='50%' fill='#e5e7eb' font-size='20' font-family='sans-serif' text-anchor='middle'>
       Gambar tidak ditemukan
     </text>
   </svg>`
);
const mvImg = document.getElementById('mv-image');
const mvPathWrap = document.getElementById('mvPath');
const mvPathText = document.getElementById('mvPathText');
document.getElementById('btnShowPath').addEventListener('click', ()=>{
  mvPathWrap.style.display = (mvPathWrap.style.display === 'none' || !mvPathWrap.style.display) ? 'inline-block' : 'none';
});
function resolveMvSrc(nameOrPath){
  if(/^https?:\/\//i.test(nameOrPath)) return nameOrPath;
  if(/assets\//i.test(nameOrPath)) return nameOrPath;
  return MV_PREFIX + nameOrPath;
}
function setMvImage(nameOrPath){
  const finalSrc = resolveMvSrc(nameOrPath);
  mvImg.onerror = function(){ mvPathText.textContent = finalSrc + " (404?)"; mvPathWrap.style.display='inline-block'; mvImg.src = MV_PLACEHOLDER; };
  mvImg.onload  = function(){ mvPathText.textContent = finalSrc; mvPathWrap.style.display='none'; };
  mvImg.src = finalSrc + "?v=" + Date.now();
}

/* ================= UTIL ================= */
const $ = sel => document.querySelector(sel);
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function includesAny(ans, arr){ const a=norm(ans); return arr.some(x=> a.includes(norm(x))); }
function similarTokens(a,b){ const A=norm(a).split(' ').filter(Boolean), B=norm(b).split(' ').filter(Boolean); if(!A.length||!B.length) return 0; let hit=0; A.forEach(t=>{ if(B.includes(t)) hit++; }); return hit/Math.max(A.length,B.length); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ================= STATE & UI ================= */
const SEQ = ['guessSong','finishLyric','guessArtist','guessMV']; // urutan dalam campaign
let mode='guessSong', campaign=false;
let pointer={guessSong:0, finishLyric:0, guessArtist:0, guessMV:0};
let order={guessSong:[], finishLyric:[], guessArtist:[], guessMV:[]};
let round=0, maxRounds=0, seqPtr=0; // progress campaign
let score=0, streak=0, best=parseInt(localStorage.getItem('music_best')||'0',10);
let timer=0, tick=null; const perQuestion=25;

const ui = {
  score: $('#score'), streak: $('#streak'), best: $('#best'), time: $('#time'),
  title: $('#title'), subtitle: $('#subtitle'), guide: $('#guide'),
  audio: $('#audio'), bar: $('#bar'),
  blockAudio: $('#block-audio'), blockLyric: $('#block-lyric'), blockMV: $('#block-mv'),
  prompt: $('#lyric-prompt'), ans: $('#answer'), fb: $('#feedback'),
  hint: $('#hint'), reveal: $('#reveal'), mvImage: $('#mv-image'),
  btn: { play: $('#btnPlay'), hint: $('#btnHint'), skip: $('#btnSkip'), reveal: $('#btnReveal'), next: $('#btnNext'), campaign: $('#btnCampaign') },
  tags: { round: $('#roundInfo'), mode: $('#modeInfo') },
  overlay: $('#overlay'), finalText: $('#finalText'),
  replayCampaign: $('#btnReplayCampaign'), closeOverlay: $('#btnCloseOverlay')
};
ui.best.textContent = best;

/* ================= INIT & ORDER ================= */
function makeOrders(){
  order.guessSong   = shuffle([...Array(SONGS_GUESS_TITLE.length).keys()]);
  order.finishLyric = shuffle([...Array(LYRICS_SET.length).keys()]);
  order.guessArtist = shuffle([...Array(SONGS_GUESS_ARTIST.length).keys()]);
  order.guessMV     = shuffle([...Array(MV_SET.length).keys()]);
  pointer.guessSong = pointer.finishLyric = pointer.guessArtist = pointer.guessMV = 0;
}
function computeMaxRounds(){
  // Satu round = 4 soal (1 per mode). Banyak round = min dari tiap dataset.
  maxRounds = Math.min(
    SONGS_GUESS_TITLE.length,
    LYRICS_SET.length,
    SONGS_GUESS_ARTIST.length,
    MV_SET.length
  );
}

/* ================= MODE BEBAS ================= */
document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    campaign=false; ui.tags.round.textContent='Round: -/-';
    setMode(btn.dataset.mode);
  });
});

function setMode(m){
  mode = m;
  ui.tags.mode.textContent = 'Mode: ' + (
    mode==='guessSong'   ? 'Tebak Lagu' :
    mode==='finishLyric' ? 'Sambung Lirik' :
    mode==='guessArtist' ? 'Tebak Penyanyi' : 'Tebak MV'
  );
  // untuk mode bebas, pakai order & pointer sendiri; kalau habis → reshuffle
  if(order[m].length===0) makeOrders();
  if(pointer[m] >= order[m].length){ order[m] = shuffle(order[m]); pointer[m]=0; }
  score=0; streak=0; ui.score.textContent=0; ui.streak.textContent=0;
  ui.fb.textContent=''; ui.hint.textContent=''; ui.reveal.classList.add('hidden'); ui.reveal.textContent='';
  renderQuestionForMode(m);
}

/* ================= CAMPAIGN ================= */
ui.btn.campaign.addEventListener('click', startCampaign);
ui.replayCampaign.addEventListener('click', ()=>{ ui.overlay.style.display='none'; startCampaign(); });
ui.closeOverlay.addEventListener('click', ()=>{ ui.overlay.style.display='none'; });

function startCampaign(){
  campaign = true; makeOrders(); computeMaxRounds();
  score=0; streak=0; round=1; seqPtr=0;
  ui.score.textContent=0; ui.streak.textContent=0;
  ui.tags.round.textContent = 'Round: ' + round + '/' + maxRounds;
  goToSeq(0); // mulai dari guessSong
}
function goToSeq(ptr){
  seqPtr = ptr; // 0..(maxRounds*4-1)
  const seqIndex = seqPtr % SEQ.length;
  const curMode = SEQ[seqIndex];
  ui.tags.mode.textContent = 'Mode: ' + (
    curMode==='guessSong'   ? 'Tebak Lagu' :
    curMode==='finishLyric' ? 'Sambung Lirik' :
    curMode==='guessArtist' ? 'Tebak Penyanyi' : 'Tebak MV'
  );
  renderQuestionForMode(curMode);
}
function advanceCampaign(){
  // pindah ke step berikutnya dalam round/campaign
  const nextPtr = seqPtr + 1;
  if(nextPtr >= maxRounds * SEQ.length){
    // selesai campaign
    ui.finalText.textContent = 'Skor total: ' + score;
    if(score>best){ best=score; localStorage.setItem('music_best', String(best)); ui.best.textContent=best; }
    ui.overlay.style.display='flex';
    return;
  }
  // kalau pindah ke awal urutan → round++ (setiap 4 soal)
  const nextSeqIndex = nextPtr % SEQ.length;
  if(nextSeqIndex === 0){ round++; ui.tags.round.textContent = 'Round: ' + round + '/' + maxRounds; }
  goToSeq(nextPtr);
}

/* ================= RENDER SOAL PER MODE ================= */
function showOnly(block){
  ui.blockAudio.classList.add('hidden'); ui.blockLyric.classList.add('hidden'); ui.blockMV.classList.add('hidden');
  block.classList.remove('hidden');
}
function resetForQuestion(){
  ui.ans.value=''; ui.ans.focus();
  ui.fb.textContent=''; ui.hint.textContent=''; ui.reveal.classList.add('hidden'); ui.reveal.textContent='';
  ui.bar.style.width='0%';
  clearInterval(tick); timer = perQuestion; ui.time.textContent=timer;
  tick = setInterval(()=>{ timer--; ui.time.textContent=timer; ui.bar.style.width = Math.round(((perQuestion-timer)/perQuestion)*100)+'%'; if(timer<=0){ clearInterval(tick); wrongReveal('Waktu habis.'); postAnswerFlow(); } },1000);
}
function renderQuestionForMode(m){
  if(m==='guessSong'){
    if(pointer.guessSong >= order.guessSong.length) { order.guessSong = shuffle(order.guessSong); pointer.guessSong=0; }
    const s = SONGS_GUESS_TITLE[ order.guessSong[pointer.guessSong] ];
    ui.title.textContent='Tebak Lagu (Audio)'; ui.subtitle.textContent='Dengarkan potongan audio, tebak judul lagunya.';
    showOnly(ui.blockAudio); ui.audio.src = s.audio; ui.guide.textContent='Ketik judul lagu lalu Enter.';
  }
  if(m==='finishLyric'){
    if(pointer.finishLyric >= order.finishLyric.length) { order.finishLyric = shuffle(order.finishLyric); pointer.finishLyric=0; }
    const s = LYRICS_SET[ order.finishLyric[pointer.finishLyric] ];
    ui.title.textContent='Sambung Lirik'; ui.subtitle.textContent='Lanjutkan baris berikutnya.';
    showOnly(ui.blockLyric); ui.prompt.textContent = s.prompt; ui.guide.textContent='Tulis sambungan baris berikutnya (kemiripan ≥ 60%).';
  }
  if(m==='guessArtist'){
    if(pointer.guessArtist >= order.guessArtist.length) { order.guessArtist = shuffle(order.guessArtist); pointer.guessArtist=0; }
    const s = SONGS_GUESS_ARTIST[ order.guessArtist[pointer.guessArtist] ];
    ui.title.textContent='Tebak Penyanyi (Audio)'; ui.subtitle.textContent='Dengarkan potongan audio, tebak nama penyanyinya.';
    showOnly(ui.blockAudio); ui.audio.src = s.audio; ui.guide.textContent='Ketik nama penyanyi/artis lalu Enter.';
  }
  if(m==='guessMV'){
    if(pointer.guessMV >= order.guessMV.length) { order.guessMV = shuffle(order.guessMV); pointer.guessMV=0; }
    const s = MV_SET[ order.guessMV[pointer.guessMV] ];
    ui.title.textContent='Tebak MV (Gambar)'; ui.subtitle.textContent='Dari potongan gambar, tebak judul lagu (video klip).';
    showOnly(ui.blockMV); setMvImage(s.image); ui.mvImage.classList.add('mv-blur'); ui.guide.textContent='Ketik judul lagu (Hint akan mengurangi blur).';
  }
  resetForQuestion();
}

/* ================= PENILAIAN & ALUR LANJUT ================= */
function correct(msg){
  streak++; score += 10 + Math.max(0, timer);
  ui.streak.textContent = streak; ui.score.textContent = score;
  ui.fb.innerHTML = `<span class="ok">✔ ${msg}</span>`;
  clearInterval(tick);
}
function wrong(msg){ streak=0; ui.streak.textContent=0; ui.fb.innerHTML = `<span class="no">✖ ${msg}</span>`; }
function wrongReveal(msg){
  wrong(msg); ui.reveal.classList.remove('hidden');
  if(mode==='guessSong'){
    const s=SONGS_GUESS_TITLE[ order.guessSong[pointer.guessSong] ];
    ui.reveal.innerHTML = `<b>Jawaban:</b> <span class="ok">${s.title}</span>`;
  }else if(mode==='finishLyric'){
    const s=LYRICS_SET[ order.finishLyric[pointer.finishLyric] ];
    ui.reveal.innerHTML = `<b>Sambungan:</b> <span class="ok">${s.next}</span>`;
  }else if(mode==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ order.guessArtist[pointer.guessArtist] ];
    ui.reveal.innerHTML = `<b>Penyanyi:</b> <span class="ok">${(s.artist&&s.artist[0])||'-'}</span>`;
  }else if(mode==='guessMV'){
    const s=MV_SET[ order.guessMV[pointer.guessMV] ];
    ui.reveal.innerHTML = `<b>Judul Lagu:</b> <span class="ok">${s.title}</span>`;
    ui.mvImage.classList.remove('mv-blur');
  }
}
function postAnswerFlow(){
  // naikkan pointer mode aktif
  if(mode==='guessSong') pointer.guessSong++;
  if(mode==='finishLyric') pointer.finishLyric++;
  if(mode==='guessArtist') pointer.guessArtist++;
  if(mode==='guessMV') pointer.guessMV++;

  if(campaign){
    setTimeout(()=>{ advanceCampaign(); }, 800);
  }
}

/* ================= SUBMIT & HINT ================= */
function submitAnswer(){
  const val = ui.ans.value.trim(); if(!val) return;
  if(mode==='guessSong'){
    const s=SONGS_GUESS_TITLE[ order.guessSong[pointer.guessSong] ];
    const pass = norm(val)===norm(s.title) || includesAny(val,[s.title]);
    if(pass){ correct('Betul! '+s.title); } else { wrong('Kurang tepat.'); return; }
  }else if(mode==='finishLyric'){
    const s=LYRICS_SET[ order.finishLyric[pointer.finishLyric] ];
    const sim = similarTokens(val, s.next);
    if(sim>=0.6){ correct('Mantap! Diterima.'); } else { wrong('Kurang mirip (≥60%).'); return; }
  }else if(mode==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ order.guessArtist[pointer.guessArtist] ];
    const pass = (s.artist||[]).some(a=> norm(a)===norm(val) || includesAny(val,[a]));
    if(pass){ correct('Benar! '+(s.artist&&s.artist[0])); } else { wrong('Bukan itu.'); return; }
  }else if(mode==='guessMV'){
    const s=MV_SET[ order.guessMV[pointer.guessMV] ];
    const pass = norm(val)===norm(s.title) || includesAny(val,[s.title]);
    if(pass){ correct('Betul! '+s.title); ui.mvImage.classList.remove('mv-blur'); } else { wrong('Kurang tepat.'); return; }
  }
  postAnswerFlow();
}
function showHint(){
  if(mode==='guessSong'){
    const s=SONGS_GUESS_TITLE[ order.guessSong[pointer.guessSong] ];
    const first=(s.title||'').split(' ')[0]||''; ui.hint.textContent=`Hint: judul mulai “${first}…” (${(s.title||'').length} huruf).`;
  }else if(mode==='finishLyric'){
    const s=LYRICS_SET[ order.finishLyric[pointer.finishLyric] ];
    ui.hint.textContent=`Hint: ${s.next.split(' ').slice(0,2).join(' ')} …`;
  }else if(mode==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ order.guessArtist[pointer.guessArtist] ];
    const a=(s.artist&&s.artist[0])||''; ui.hint.textContent=`Hint: inisial “${a ? a.split(' ').map(w=>w[0]).join(' ') : '?'}”.`;
  }else if(mode==='guessMV'){
    const s=MV_SET[ order.guessMV[pointer.guessMV] ];
    const first=(s.title||'').split(' ')[0]||''; ui.mvImage.classList.remove('mv-blur'); ui.hint.textContent=`Hint: judul mulai “${first}…”.`;
  }
}

/* ================= BINDINGS ================= */
ui.btn.play.addEventListener('click', ()=>{ if(mode==='finishLyric'||mode==='guessMV') return; ui.audio.currentTime=0; ui.audio.play(); });
ui.btn.hint.addEventListener('click', showHint);
ui.btn.skip.addEventListener('click', ()=>{ wrongReveal('Dilewati.'); postAnswerFlow(); });
ui.btn.reveal.addEventListener('click', ()=>{ wrongReveal('Ditampilkan.'); });
ui.btn.next.addEventListener('click', ()=>{ postAnswerFlow(); });
ui.ans.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ submitAnswer(); }});

/* start default: Mode Bebas Tebak Lagu */
makeOrders(); setMode('guessSong');
</script>
</body>
</html>
