<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PKSPIP – Game Musik (Semua Soal Berurutan)</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{--ink:#e5e7eb;--muted:#9aa9c2;--brand:#38bdf8;--good:#34d399;--bad:#ef4444;--panel:#0b1220;--border:#182131;--bg:#0f172a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui}
a.back{position:fixed;left:12px;top:12px;color:#38bdf8;text-decoration:none;z-index:3}
.wrap{max-width:940px;margin:70px auto 40px;padding:0 16px}
h1{margin:0;color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.select{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:#111827;border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:#334155}
.btn-pill{border-radius:999px}
.badge{padding:4px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
input[type="text"]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:#0b1220;color:var(--ink);font-size:16px;outline:none}
.progress{height:8px;background:#101826;border-radius:999px;overflow:hidden;border:1px solid var(--border)}
.bar{height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#60a5fa)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:860px){.grid{grid-template-columns:1fr 1fr}}
#status{display:flex;gap:10px;flex-wrap:wrap}
#status .pill{padding:6px 10px;border:1px solid var(--border);border-radius:999px;background:#0b1220}
.ok{color:var(--good)}
.no{color:var(--bad)}
.big{font-size:18px}
.subtle{color:var(--muted);font-size:14px;margin:0}
.hint{font-style:italic;color:var(--muted)}
audio{width:100%}
.hidden{display:none}
#lyric-prompt{font-size:18px;line-height:1.7}
.mv-frame{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#0b1220}
.mv-frame img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;filter:none;transition:filter .25s}
.mv-blur{filter:blur(6px) brightness(.85)}
.mv-caption{position:absolute;right:8px;bottom:8px;background:#0009;color:#cbd5e1;border:1px solid #000;backdrop-filter:blur(2px);padding:4px 8px;border-radius:8px;font-size:12px}
</style>
</head>
<body>
<a class="back" href="../main.html">⟵ Kembali</a>

<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-end;margin-bottom:8px">
    <div>
      <h1><i class="bi bi-music-note-beamed"></i> Game Musik</h1>
      <p class="subtle" id="modeLabel">Semua Soal Berurutan • Skor kumulatif</p>
    </div>
    <div id="status">
      <span class="pill">Skor: <b id="score">0</b></span>
      <span class="pill">Streak: <b id="streak">0</b></span>
      <span class="pill">Waktu: <b id="time">-</b>s</span>
      <span class="pill">High Score: <b id="best">0</b></span>
    </div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="row" style="justify-content:space-between">
      <div class="select">
        <button class="btn btn-pill" id="allSeqBtn">Semua Soal (Berurutan)</button>
        <button class="btn btn-pill" data-mode="guessSong">Tebak Lagu (Audio)</button>
        <button class="btn btn-pill" data-mode="finishLyric">Sambung Lirik (Teks)</button>
        <button class="btn btn-pill" data-mode="guessArtist">Tebak Penyanyi (Audio)</button>
        <button class="btn btn-pill" data-mode="guessMV">Tebak MV (Gambar)</button>
      </div>
      <div class="row">
        <button class="btn" id="btnPlay"><i class="bi bi-play-fill"></i> Play</button>
        <button class="btn" id="btnHint"><i class="bi bi-lightbulb"></i> Hint</button>
        <button class="btn" id="btnSkip"><i class="bi bi-skip-forward-fill"></i> Lewati</button>
        <button class="btn" id="btnReveal"><i class="bi bi-eye"></i> Jawaban</button>
        <button class="btn" id="btnNext"><i class="bi bi-arrow-right"></i> Next</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="title">Soal</h2>
      <p id="subtitle" class="subtle">—</p>

      <!-- AUDIO -->
      <div id="block-audio" class="">
        <audio id="audio" preload="metadata" controls></audio>
      </div>

      <!-- LIRIK -->
      <div id="block-lyric" class="hidden">
        <div id="lyric-prompt" class="card" style="margin-top:8px;background:#0b1220"></div>
      </div>

      <!-- GAMBAR MV -->
      <div id="block-mv" class="hidden">
        <div class="mv-frame" style="margin-top:8px">
          <img id="mv-image" src="" alt="Potongan video klip"/>
          <div class="mv-caption">Potongan video klip</div>
        </div>
      </div>

      <div style="margin-top:10px">
        <div class="progress"><div id="bar" class="bar"></div></div>
      </div>
    </div>

    <div class="card">
      <h2>Jawab</h2>
      <p class="subtle" id="guide">Ketik jawabanmu lalu Enter.</p>
      <input id="answer" type="text" placeholder="Ketik di sini... (Enter untuk kirim)"/>
      <p id="feedback" class="subtle" style="min-height:22px;margin-top:8px"></p>
      <p id="hint" class="hint"></p>
      <p id="reveal" class="hidden big"></p>
    </div>
  </div>
</div>

<script>
/* ================== DATA KAMU (urut, TANPA shuffle) ================== */
const SONGS_GUESS_TITLE = [
  { title:'Speak for YourSelf', audio:'../assets/audio/song1.mp3' },
  { title:'Castle of Glass',    audio:'../assets/audio/song2.mp3' },
  { title:'Grand Escape',       audio:'../assets/audio/song3.mp3' },
];
const LYRICS_SET = [
  { prompt:'Pancene kowe pabu, nuruti ibumu. Jare nek ra Ninja, ra oleh dicinta',
    next:'Opo koyo ngene susahe wong kere? Ameh nyanding tresno, kalah karo bondo' },
  { prompt:'Satu alasan kenapa kau kurekam dalam memori, Satu cerita teringat di dalam hati',
    next:'Karena kau berharga dalam hidupku, teman Untuk satu pijakan menuju masa depan.' },
  { prompt:'Hitam putih jalan hidup, Pahit getir warna dunia',
    next:'Tangis tawa rasa hati, Terluka atau bahagia.' },
];
const SONGS_GUESS_ARTIST = [
  { artist:['Twentyfirst Night'], audio:'../assets/audio/song4.mp3', title:'(opsional judul)' },
  { artist:['Fun'],               audio:'../assets/audio/song5.mp3' },
  { artist:['for Revenge'],       audio:'../assets/audio/song6.mp3' },
];
const MV_SET = [
  { title:'Just The Way You Are', image:'../assets/mv/mv1.png' },
  { title:'Manusia Bodoh',        image:'../assets/mv/mv2.png' },
  { title:'Still Life',           image:'../assets/mv/mv3.png' },
];

/* ================== UTIL ================== */
const $ = s=>document.querySelector(s);
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function includesTitle(ans, title){ const a=norm(ans), t=norm(title); return a===t || a.includes(t); }
function includesArtist(ans, arr){ const a=norm(ans); return (arr||[]).some(x=>a===norm(x) || a.includes(norm(x))); }

/* ================== STATE ================== */
let mode='all'; // 'all' | 'guessSong' | 'finishLyric' | 'guessArtist' | 'guessMV'
let ptr={ song:0, lyric:0, artist:0, mv:0 };
let seq=['guessSong','finishLyric','guessArtist','guessMV']; // urutan tetap
let seqIdx=0; // index dalam seq saat mode 'all'
let score=0, streak=0, best=parseInt(localStorage.getItem('music_best')||'0',10);
let timer=0, tick=null; const perQuestion=25;

// UI
const ui={score:$('#score'),streak:$('#streak'),best:$('#best'),time:$('#time'),
title:$('#title'),subtitle:$('#subtitle'),guide:$('#guide'),
audio:$('#audio'),bar:$('#bar'),
blockAudio:$('#block-audio'),blockLyric:$('#block-lyric'),blockMV:$('#block-mv'),
prompt:$('#lyric-prompt'),ans:$('#answer'),fb:$('#feedback'),
hint:$('#hint'),reveal:$('#reveal'),img:$('#mv-image'),
modeLabel:$('#modeLabel')};
ui.best.textContent=best;

/* ================== RENDER ================== */
function showOnly(block){ ui.blockAudio.classList.add('hidden'); ui.blockLyric.classList.add('hidden'); ui.blockMV.classList.add('hidden'); block.classList.remove('hidden'); }
function resetForQuestion(){
  ui.ans.value=''; ui.ans.focus();
  ui.fb.textContent=''; ui.hint.textContent=''; ui.reveal.classList.add('hidden'); ui.reveal.textContent='';
  ui.bar.style.width='0%'; clearInterval(tick); timer=perQuestion; ui.time.textContent=timer;
  tick=setInterval(()=>{ timer--; ui.time.textContent=timer; ui.bar.style.width=Math.round(((perQuestion-timer)/perQuestion)*100)+'%'; if(timer<=0){ clearInterval(tick); wrongReveal('Waktu habis.'); afterAnswer(); } },1000);
}
function render(){
  // tentukan mode aktif (kalau 'all' ambil dari seq)
  const cur = mode==='all' ? seq[seqIdx] : mode;

  if(cur==='guessSong'){
    const s=SONGS_GUESS_TITLE[ptr.song % SONGS_GUESS_TITLE.length];
    ui.title.textContent='Tebak Lagu (Audio)'; ui.subtitle.textContent='Dengarkan audio, tebak judulnya.'; showOnly(ui.blockAudio);
    ui.audio.src=s.audio; ui.guide.textContent='Ketik judul lagu lalu Enter.';
  }
  if(cur==='finishLyric'){
    const s=LYRICS_SET[ptr.lyric % LYRICS_SET.length];
    ui.title.textContent='Sambung Lirik'; ui.subtitle.textContent='Lanjutkan baris berikutnya.'; showOnly(ui.blockLyric);
    ui.prompt.textContent=s.prompt; ui.guide.textContent='Tulis sambungan (kemiripan ≥60% dianggap benar).';
  }
  if(cur==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ptr.artist % SONGS_GUESS_ARTIST.length];
    ui.title.textContent='Tebak Penyanyi (Audio)'; ui.subtitle.textContent='Dengarkan audio, tebak artisnya.'; showOnly(ui.blockAudio);
    ui.audio.src=s.audio; ui.guide.textContent='Ketik nama penyanyi/artis lalu Enter.';
  }
  if(cur==='guessMV'){
    const s=MV_SET[ptr.mv % MV_SET.length];
    ui.title.textContent='Tebak MV (Gambar)'; ui.subtitle.textContent='Dari gambar, tebak judul lagu (video klip).'; showOnly(ui.blockMV);
    ui.img.src=s.image; ui.img.classList.add('mv-blur'); ui.guide.textContent='Ketik judul lagu (Hint mengurangi blur).';
  }
  resetForQuestion();
}

/* ================== PENILAIAN ================== */
function correct(msg){ streak++; score += 10 + Math.max(0,timer); ui.streak.textContent=streak; ui.score.textContent=score; ui.fb.innerHTML=`<span class="ok">✔ ${msg}</span>`; clearInterval(tick); if(score>best){ best=score; localStorage.setItem('music_best', String(best)); ui.best.textContent=best; } }
function wrong(msg){ streak=0; ui.streak.textContent=0; ui.fb.innerHTML=`<span class="no">✖ ${msg}</span>`; }
function wrongReveal(msg){
  wrong(msg); ui.reveal.classList.remove('hidden');
  const cur = mode==='all'? seq[seqIdx] : mode;
  if(cur==='guessSong'){ const s=SONGS_GUESS_TITLE[ptr.song % SONGS_GUESS_TITLE.length]; ui.reveal.innerHTML=`<b>Judul:</b> <span class="ok">${s.title}</span>`; }
  if(cur==='finishLyric'){ const s=LYRICS_SET[ptr.lyric % LYRICS_SET.length]; ui.reveal.innerHTML=`<b>Sambungan:</b> <span class="ok">${s.next}</span>`; }
  if(cur==='guessArtist'){ const s=SONGS_GUESS_ARTIST[ptr.artist % SONGS_GUESS_ARTIST.length]; ui.reveal.innerHTML=`<b>Penyanyi:</b> <span class="ok">${s.artist[0]}</span>`; }
  if(cur==='guessMV'){ const s=MV_SET[ptr.mv % MV_SET.length]; ui.reveal.innerHTML=`<b>Judul Lagu:</b> <span class="ok">${s.title}</span>`; ui.img.classList.remove('mv-blur'); }
}
function afterAnswer(){
  // naikkan pointer mode aktif
  const cur = mode==='all'? seq[seqIdx] : mode;
  if(cur==='guessSong') ptr.song++;
  if(cur==='finishLyric') ptr.lyric++;
  if(cur==='guessArtist') ptr.artist++;
  if(cur==='guessMV') ptr.mv++;

  if(mode==='all'){ // lanjut ke mode berikutnya berurutan
    seqIdx = (seqIdx + 1) % seq.length;
  }
  setTimeout(render, 800);
}

/* ================== JAWAB & HINT ================== */
function submitAnswer(){
  const v=ui.ans.value.trim(); if(!v) return;
  const cur = mode==='all'? seq[seqIdx] : mode;

  if(cur==='guessSong'){
    const s=SONGS_GUESS_TITLE[ptr.song % SONGS_GUESS_TITLE.length];
    if(includesTitle(v,s.title)) correct('Betul! '+s.title); else { wrong('Kurang tepat.'); return; }
  }else if(cur==='finishLyric'){
    const s=LYRICS_SET[ptr.lyric % LYRICS_SET.length];
    // kemiripan token sederhana
    const A=norm(v).split(' ').filter(Boolean), B=norm(s.next).split(' ').filter(Boolean);
    const hit=A.filter(t=>B.includes(t)).length; const sim = hit/Math.max(A.length,B.length||1);
    if(sim>=0.6) correct('Mantap! Diterima.'); else { wrong('Kurang mirip (≥60%).'); return; }
  }else if(cur==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ptr.artist % SONGS_GUESS_ARTIST.length];
    if(includesArtist(v, s.artist)) correct('Benar! '+s.artist[0]); else { wrong('Bukan itu.'); return; }
  }else if(cur==='guessMV'){
    const s=MV_SET[ptr.mv % MV_SET.length];
    if(includesTitle(v,s.title)) { correct('Betul! '+s.title); ui.img.classList.remove('mv-blur'); } else { wrong('Kurang tepat.'); return; }
  }
  afterAnswer();
}
function showHint(){
  const cur = mode==='all'? seq[seqIdx] : mode;
  if(cur==='guessSong'){
    const s=SONGS_GUESS_TITLE[ptr.song % SONGS_GUESS_TITLE.length]; const f=(s.title||'').split(' ')[0]||''; ui.hint.textContent=`Hint: judul mulai “${f}…” (${(s.title||'').length} huruf).`;
  }else if(cur==='finishLyric'){
    const s=LYRICS_SET[ptr.lyric % LYRICS_SET.length]; ui.hint.textContent=`Hint: ${s.next.split(' ').slice(0,2).join(' ')} …`;
  }else if(cur==='guessArtist'){
    const s=SONGS_GUESS_ARTIST[ptr.artist % SONGS_GUESS_ARTIST.length]; const a=(s.artist&&s.artist[0])||''; ui.hint.textContent=`Hint: inisial “${a ? a.split(' ').map(w=>w[0]).join(' ') : '?'}”.`;
  }else if(cur==='guessMV'){
    const s=MV_SET[ptr.mv % MV_SET.length]; const f=(s.title||'').split(' ')[0]||''; ui.img.classList.remove('mv-blur'); ui.hint.textContent=`Hint: judul mulai “${f}…”.`;
  }
}

/* ================== KONTROL ================== */
document.getElementById('allSeqBtn').addEventListener('click', ()=>{
  mode='all'; seqIdx=0; ui.modeLabel.textContent='Semua Soal Berurutan • Skor kumulatif';
  render();
});
document.querySelectorAll('[data-mode]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    mode = btn.dataset.mode; ui.modeLabel.textContent = 'Mode: ' + btn.textContent;
    render();
  });
});
document.getElementById('btnPlay').addEventListener('click', ()=>{ const cur=mode==='all'?seq[seqIdx]:mode; if(cur==='finishLyric'||cur==='guessMV') return; ui.audio.currentTime=0; ui.audio.play(); });
document.getElementById('btnHint').addEventListener('click', showHint);
document.getElementById('btnSkip').addEventListener('click', ()=>{ wrongReveal('Dilewati.'); afterAnswer(); });
document.getElementById('btnReveal').addEventListener('click', ()=>{ wrongReveal('Ditampilkan.'); });
document.getElementById('btnNext').addEventListener('click', afterAnswer);
ui.ans.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAnswer(); });

/* start default: semua soal berurutan */
render();
</script>
</body>
</html>
