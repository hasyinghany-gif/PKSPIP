<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PKSPIP – Typing Race Arena</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

<style>
:root{--ink:#e5e7eb;--muted:#9aa9c2;--brand:#38bdf8;--panel:#0b1220;--border:#1f2937;--good:#34d399;--bad:#ef4444}
html,body{margin:0;height:100%;background:#0f172a;color:var(--ink);font-family:Inter,system-ui;overflow:hidden}
a.back{position:fixed;left:12px;top:12px;color:#38bdf8;text-decoration:none;z-index:4}
.wrap{max-width:960px;margin:74px auto 18px;padding:0 16px}
h1{margin:0 0 6px;color:var(--brand)}
.sub{margin:0 0 14px;color:#9aa9c2}
.top{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.btn{background:#111827;border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:hover{border-color:#334155}
.badge{padding:4px 8px;border-radius:999px;border:1px solid var(--border);color:#9aa9c2}
#arena{display:grid;grid-template-columns:1fr;gap:12px}
#text{background:#0b1220;border:1px solid #182131;border-radius:12px;padding:14px;font-size:18px;line-height:1.7;min-height:140px}
.word{padding:1px 2px}
.current{background:#334155;border-radius:4px}
.correct{color:var(--good)}
.wrong{color:var(--bad);text-decoration:underline}
#input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #182131;background:#0b1220;color:#fff;font-size:16px;outline:none}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center}
.progress{height:10px;background:#132033;border-radius:999px;overflow:hidden;border:1px solid #182131}
.bar-a{height:100%;width:0;background:#93c5fd}
.bar-b{height:100%;width:0;background:#f472b6}
.bar-c{height:100%;width:0;background:#34d399}
.bar-d{height:100%;width:0;background:#fbbf24}
.stat{font-variant-numeric:tabular-nums}
#overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}
#card{background:#0b1220;border:1px solid #182131;padding:18px 20px;border-radius:16px;min-width:280px;text-align:center}
#countdown{font-size:40px;font-weight:700;margin:10px 0 0;text-align:center}
@media(min-width:980px){#arena{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<a href="../main.html" class="back">⟵ Kembali</a>

<div class="wrap">
  <div class="top">
    <h1>Typing Race Arena</h1>
    <span class="badge" id="roomBadge">room: room-1</span>
    <button class="btn" id="seatA">A</button>
    <button class="btn" id="seatB">B</button>
    <button class="btn" id="seatC">C</button>
    <button class="btn" id="seatD">D</button>
    <button class="btn" id="quickBtn">Quick Match</button>
    <button class="btn" id="startBtn">Start</button>
    <button class="btn" id="resetBtn">Reset Room</button>
  </div>

  <p class="sub">Masuk room yang sama, ambil kursi (A–D). Tekan <b>Start</b> (oleh siapa saja). Countdown 5 detik lalu balapan mengetik!</p>

  <div class="row">
    <div class="badge" id="seatInfo">A:- | B:- | C:- | D:-</div>
    <div class="stat">⏱ <span id="timer">60</span>s | WPM: <span id="wpm">0</span> | Akurasi: <span id="acc">0%</span> | Fase: <span id="phase">lobby</span></div>
  </div>

  <div id="arena">
    <div><b>A</b> <span id="nameA" class="badge">-</span> <div class="progress"><div class="bar-a" id="barA"></div></div></div>
    <div><b>B</b> <span id="nameB" class="badge">-</span> <div class="progress"><div class="bar-b" id="barB"></div></div></div>
    <div><b>C</b> <span id="nameC" class="badge">-</span> <div class="progress"><div class="bar-c" id="barC"></div></div></div>
    <div><b>D</b> <span id="nameD" class="badge">-</span> <div class="progress"><div class="bar-d" id="barD"></div></div></div>
  </div>

  <div id="text" style="margin-top:12px"></div>
  <input id="input" type="text" placeholder="Mulai mengetik di sini..." disabled>
  <div id="countdown"></div>
</div>

<div id="overlay">
  <div id="card">
    <h2 id="title">Hasil</h2>
    <p id="result">–</p>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
      <button class="btn" id="again">Main Lagi</button>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>
  </div>
</div>

<script>
/* -------------------- UTIL DOM -------------------- */
function $(id){ return document.getElementById(id); }
const UI={
  timer: $('timer'), wpm: $('wpm'), acc: $('acc'), phaseEl: $('phase'),
  countdown: $('countdown'), input: $('input'), overlay: $('overlay'),
  result: $('result'), title: $('title'), seatInfo: $('seatInfo'),
  barA: $('barA'), barB: $('barB'), barC: $('barC'), barD: $('barD'),
  nameA: $('nameA'), nameB: $('nameB'), nameC: $('nameC'), nameD: $('nameD'),
  btnAgain: $('again'), btnRefresh: $('refreshBtn'),
  btnStart: $('startBtn'), btnReset: $('resetBtn'), btnQuick: $('quickBtn'),
  roomBadge: $('roomBadge')
};

/* -------------------- ROOM & TEXT -------------------- */
const qp = new URLSearchParams(location.search);
const roomId = qp.get('room') || 'room-1';
UI.roomBadge.textContent = 'room: ' + roomId;

const texts = [
  'Typing fast is not just about speed; accuracy and rhythm matter too.',
  'Practice every day to build muscle memory and consistency.',
  'Light hands and steady breathing help you type more smoothly.',
  'Be patient; small progress every session compounds over time.'
];

let words=[], totalChars=0, curIdx=0, typed=0, correct=0, myChars=0;
let phase='lobby', duration=60, startedAt=0;
let raceInterval=null, cdInterval=null;

/* -------------------- DRAW / RESET -------------------- */
function loadText(){
  const t = texts[Math.floor(Math.random()*texts.length)];
  words = t.split(' ');
  totalChars = t.length;
  $('text').innerHTML = words.map(function(w,i){
    return '<span class="word" id="w'+i+'">'+w+'</span>';
  }).join(' ');
  curIdx=0; typed=0; correct=0; myChars=0;
  highlight();
}
function highlight(){
  var all = document.querySelectorAll('.word');
  for(var i=0;i<all.length;i++){ all[i].classList.remove('current'); }
  var cur = $('w'+curIdx); if(cur){ cur.classList.add('current'); }
}
function mark(cls){
  var n = $('w'+curIdx); if(n){ n.classList.add(cls); }
}
function clearTimers(){ if(raceInterval){clearInterval(raceInterval);} if(cdInterval){clearInterval(cdInterval);} raceInterval=null; cdInterval=null; }
function resetLocalUI(){
  UI.input.value=''; UI.input.disabled=true;
  UI.countdown.textContent=''; UI.wpm.textContent='0'; UI.acc.textContent='0%';
  UI.timer.textContent=String(duration); UI.overlay.style.display='none';
  UI.barA.style.width=UI.barB.style.width=UI.barC.style.width=UI.barD.style.width='0%';
}

/* -------------------- LOCAL MODE (fallback) -------------------- */
let RTDB = null;       // nanti diisi Firebase; kalau null -> lokal mode
let seatsRef, stateRef, progressRef;
let uid='local-'+Math.random().toString(36).slice(2,6), meName='User-'+uid.slice(0,4);

/* -------------------- FIREBASE INIT (safe) -------------------- */
(function initFirebase(){
  try{
    const firebaseConfig = {
      apiKey: "AIzaSyDl-YQJ7gQuOZ0QXtdjIxLGlv2AwBTj0dU",
      authDomain: "shooter-fd9ba.firebaseapp.com",
      databaseURL: "https://shooter-fd9ba-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "shooter-fd9ba",
      storageBucket: "shooter-fd9ba.appspot.com",
      messagingSenderId: "735948321115",
      appId: "1:735948321115:web:aab8d41e506535bf5eea7e"
    };
    firebase.initializeApp(firebaseConfig);
    RTDB = firebase.database();
    seatsRef    = RTDB.ref('rooms/'+roomId+'/arenaTyping/seats');
    stateRef    = RTDB.ref('rooms/'+roomId+'/arenaTyping/state');
    progressRef = RTDB.ref('rooms/'+roomId+'/arenaTyping/progress');

    firebase.auth().onAuthStateChanged(function(u){
      if(!u){ firebase.auth().signInAnonymously(); return; }
      uid = u.uid; meName = 'User-'+uid.slice(0,4);

      // listeners
      seatsRef.on('value', function(s){
        var v = s.val() || {};
        UI.nameA.textContent = v.A && v.A.name ? v.A.name : '-';
        UI.nameB.textContent = v.B && v.B.name ? v.B.name : '-';
        UI.nameC.textContent = v.C && v.C.name ? v.C.name : '-';
        UI.nameD.textContent = v.D && v.D.name ? v.D.name : '-';
        UI.seatInfo.textContent = 'A:'+UI.nameA.textContent+' | B:'+UI.nameB.textContent+' | C:'+UI.nameC.textContent+' | D:'+UI.nameD.textContent;
      });

      stateRef.on('value', function(s){ handleState(s.val()); });

      progressRef.on('value', function(s){ updateProgressUI(s.val()||{}); });
    });
  }catch(e){
    // kalau gagal, biarkan RTDB tetap null -> jalan sebagai latihan lokal
    console.warn('Firebase init gagal. Jalan di mode lokal.', e);
  }
})();

/* -------------------- SEAT & CONTROLS -------------------- */
$('seatA').onclick=function(){ claimSeat('A'); };
$('seatB').onclick=function(){ claimSeat('B'); };
$('seatC').onclick=function(){ claimSeat('C'); };
$('seatD').onclick=function(){ claimSeat('D'); };

UI.btnStart.onclick=function(){ startMatch(); };
UI.btnReset.onclick=function(){ resetRoom(); };
UI.btnQuick.onclick=function(){ startMatch(); };
UI.btnAgain.onclick=function(){ resetRoom(); };
UI.btnRefresh.onclick=function(){ location.reload(); };

function claimSeat(letter){
  if(!RTDB || !seatsRef){ return; } // lokal: abaikan
  seatsRef.transaction(function(cur){
    cur = cur || {};
    if(!cur[letter]) cur[letter] = {uid: uid, name: meName};
    return cur;
  });
}

/* -------------------- INPUT -------------------- */
UI.input.addEventListener('keydown', function(e){
  if(phase!=='running') return;
  if(e.key===' '){
    e.preventDefault();
    var typedWord = UI.input.value.trim();
    var target = words[curIdx] || '';
    typed++;
    if(typedWord===target){ correct++; mark('correct'); myChars += target.length+1; }
    else { mark('wrong'); myChars += Math.max(typedWord.length, target.length)+1; }
    curIdx++; UI.input.value=''; highlight(); updateHUD(); pushProgress(false);
    if(curIdx>=words.length){
      pushProgress(true);
      finishRace('Selesai lebih dulu!');
      if(stateRef) stateRef.update({phase:'ended'});
      else { phase='ended'; finishRace('Sesi selesai.'); }
    }
  }
});

function updateHUD(){
  var elapsedSec = Math.max(1, (Date.now()-startedAt)/1000);
  var wpm = Math.round((correct/(elapsedSec/60))||0);
  var acc = typed ? Math.round((correct/typed)*100) : 0;
  UI.wpm.textContent = String(wpm);
  UI.acc.textContent = String(acc)+'%';
}

/* -------------------- PROGRESS -------------------- */
function pushProgress(finished){
  if(!progressRef) return; // lokal: abaikan
  var wpm = parseInt(UI.wpm.textContent,10) || 0;
  var acc = parseInt(UI.acc.textContent,10) || 0;
  progressRef.child(uid).set({name:meName, chars:myChars, total:totalChars, wpm:wpm, acc:acc, finished:finished, ts:Date.now()});
}
function updateProgressUI(val){
  if(!seatsRef){ // lokal: bar A diisi milik sendiri
    var pctLocal = totalChars? Math.min(100, Math.round((myChars/totalChars)*100)) : 0;
    UI.barA.style.width = pctLocal+'%';
    return;
  }
  seatsRef.get().then(function(s){
    var m = s.val() || {};
    var uidA = m.A && m.A.uid ? m.A.uid : null;
    var uidB = m.B && m.B.uid ? m.B.uid : null;
    var uidC = m.C && m.C.uid ? m.C.uid : null;
    var uidD = m.D && m.D.uid ? m.D.uid : null;
    function pct(u){
      var p = u && val[u] ? val[u] : null;
      if(!p || !p.total) return 0;
      return Math.min(100, Math.round(( (p.chars||0) / p.total )*100));
    }
    UI.barA.style.width = pct(uidA)+'%';
    UI.barB.style.width = pct(uidB)+'%';
    UI.barC.style.width = pct(uidC)+'%';
    UI.barD.style.width = pct(uidD)+'%';
  });
}

/* -------------------- MATCH FLOW -------------------- */
function resetRoom(){
  clearTimers();
  if(progressRef) progressRef.remove();
  if(stateRef){
    stateRef.set({textIndex:0, startedAt:0, duration:60, phase:'lobby', ts:firebase.database.ServerValue.TIMESTAMP});
  }else{
    phase='lobby';
  }
  loadText(); resetLocalUI();
}
function startMatch(){
  clearTimers(); if(progressRef) progressRef.remove();
  var now = Date.now();
  if(stateRef){
    stateRef.update({textIndex:0, startedAt: now+5000, duration:60, phase:'countdown', ts:firebase.database.ServerValue.TIMESTAMP});
  }else{
    // lokal mode
    phase='countdown'; handleState({phase:'countdown', startedAt: now+5000, duration:60});
  }
}
function handleState(s){
  if(!s){
    if(stateRef) stateRef.set({textIndex:0, startedAt:0, duration:60, phase:'lobby', ts:firebase.database.ServerValue.TIMESTAMP});
    loadText(); return;
  }
  phase = s.phase || 'lobby';
  duration = s.duration || 60;
  UI.phaseEl.textContent = phase;

  if(phase==='lobby'){ clearTimers(); loadText(); resetLocalUI(); }
  else if(phase==='countdown'){ loadText(); resetLocalUI(); startCountdown(s.startedAt || (Date.now()+5000)); }
  else if(phase==='running'){ UI.countdown.textContent=''; startRun(s.startedAt || Date.now()); }
  else if(phase==='ended'){ clearTimers(); finishRace('Sesi selesai.'); }
}
function startCountdown(ts){
  clearTimers();
  cdInterval = setInterval(function(){
    var diff = Math.max(0, Math.ceil((ts - Date.now())/1000));
    UI.countdown.textContent = String(diff);
    if(diff<=0){
      clearInterval(cdInterval); cdInterval=null;
      if(stateRef) stateRef.update({phase:'running'});
      else { handleState({phase:'running', startedAt: Date.now(), duration: duration}); }
    }
  }, 250);
}
function startRun(startMs){
  clearTimers(); startedAt = startMs; phase='running';
  UI.input.disabled=false; UI.input.focus();
  raceInterval = setInterval(function(){
    var rem = Math.max(0, Math.ceil(duration - ((Date.now()-startedAt)/1000)));
    UI.timer.textContent = String(rem); updateHUD();
    if(rem<=0){
      clearInterval(raceInterval); raceInterval=null;
      pushProgress(false); finishRace('Waktu habis.');
      if(stateRef) stateRef.update({phase:'ended'});
      else { handleState({phase:'ended'}); }
    }
  }, 250);
}
function finishRace(msg){
  UI.input.disabled=true;
  UI.title.textContent='Hasil'; UI.result.textContent=msg; UI.overlay.style.display='flex';
}

/* -------------------- START -------------------- */
loadText(); resetLocalUI();
</script>
</body>
</html>
